<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" style="font-family: serif; background: #faf9f5;">
  <!-- 纸面背景 -->
  <rect width="400" height="300" fill="#faf9f5" rx="2"/>
  <!-- 方格线 -->
  <g stroke="#e8e4d9" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
  </g>
  <!-- 题目文字 -->
  <text x="20" y="28" font-size="13" fill="#2c2a26" font-weight="600">△ABC 几何题</text>
  <text x="20" y="50" font-size="12" fill="#3a3630">已知 AB=5，BC=12，AC=13</text>
  <text x="20" y="68" font-size="12" fill="#3a3630">求证：∠ABC=90°，并求 sin A</text>
  <!-- 三角形 -->
  <g transform="translate(80, 240)">
    <!-- 三角形顶点：B(直角), A, C -->
    <!-- B(0,0) A(0,-120) C(180,0) 构成直角三角形 -->
    <polygon points="0,0 0,-120 180,0" fill="none" stroke="#1a4a6e" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- 直角标记 -->
    <rect x="3" y="-17" width="14" height="14" fill="none" stroke="#2c2a26" stroke-width="1.2"/>
    <!-- 顶点标注 -->
    <text x="-16" y="4" font-size="13" fill="#2c2a26" font-weight="600">B</text>
    <text x="-16" y="-125" font-size="13" fill="#2c2a26" font-weight="600">A</text>
    <text x="186" y="4" font-size="13" fill="#2c2a26" font-weight="600">C</text>
    <!-- 边长标注 -->
    <text x="-22" y="-55" font-size="11" fill="#c0392b" text-anchor="middle">5</text>
    <text x="90" y="16" font-size="11" fill="#c0392b" text-anchor="middle">12</text>
    <text x="95" y="-68" font-size="11" fill="#c0392b" text-anchor="middle">13</text>
    <!-- ∠A 圆弧 -->
    <path d="M 20,-112 A 20 20 0 0 1 10,-94" fill="none" stroke="#6b4226" stroke-width="1.2"/>
    <text x="22" y="-98" font-size="10" fill="#6b4226">A</text>
  </g>
  <!-- 结论区 -->
  <text x="290" y="160" font-size="11" fill="#6b6660">验证：</text>
  <text x="290" y="178" font-size="11" fill="#3a3630">5²+12²=169</text>
  <text x="290" y="196" font-size="11" fill="#3a3630">=13²  ✓</text>
  <text x="290" y="220" font-size="11" fill="#c0392b">sin A=12/13</text>
</svg>
