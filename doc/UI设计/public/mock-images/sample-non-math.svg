<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" style="font-family: sans-serif; background: #fdf6ec;">
  <!-- 天空背景 -->
  <rect width="400" height="300" fill="#e8f4fd" rx="2"/>
  <!-- 草地 -->
  <rect x="0" y="220" width="400" height="80" fill="#a8d5a2" rx="0"/>
  <!-- 太阳 -->
  <circle cx="340" cy="55" r="30" fill="#f9ca24" opacity="0.9"/>
  <!-- 光芒 -->
  <g stroke="#f9ca24" stroke-width="2" opacity="0.7">
    <line x1="340" y1="15" x2="340" y2="5"/>
    <line x1="370" y1="25" x2="378" y2="17"/>
    <line x1="380" y1="55" x2="390" y2="55"/>
    <line x1="370" y1="85" x2="378" y2="93"/>
    <line x1="310" y1="25" x2="302" y2="17"/>
    <line x1="300" y1="55" x2="290" y2="55"/>
  </g>
  <!-- 云朵 -->
  <g fill="white" opacity="0.9">
    <ellipse cx="80" cy="70" rx="40" ry="22"/>
    <ellipse cx="55" cy="78" rx="25" ry="16"/>
    <ellipse cx="110" cy="78" rx="28" ry="16"/>
    <ellipse cx="210" cy="55" rx="32" ry="18"/>
    <ellipse cx="188" cy="62" rx="20" ry="12"/>
    <ellipse cx="234" cy="62" rx="22" ry="12"/>
  </g>
  <!-- 猫咪身体 -->
  <g transform="translate(160, 160)">
    <!-- 身体 -->
    <ellipse cx="40" cy="40" rx="38" ry="32" fill="#f5c9a0" stroke="#c8956a" stroke-width="1.5"/>
    <!-- 头部 -->
    <circle cx="40" cy="5" r="28" fill="#f5c9a0" stroke="#c8956a" stroke-width="1.5"/>
    <!-- 耳朵左 -->
    <polygon points="16,-18 8,-38 28,-22" fill="#f5c9a0" stroke="#c8956a" stroke-width="1.2"/>
    <polygon points="18,-20 14,-32 24,-22" fill="#f0a0a0"/>
    <!-- 耳朵右 -->
    <polygon points="64,-18 72,-38 52,-22" fill="#f5c9a0" stroke="#c8956a" stroke-width="1.2"/>
    <polygon points="62,-20 66,-32 56,-22" fill="#f0a0a0"/>
    <!-- 眼睛 -->
    <ellipse cx="28" cy="2" rx="7" ry="8" fill="#2c2a26"/>
    <ellipse cx="52" cy="2" rx="7" ry="8" fill="#2c2a26"/>
    <circle cx="30" cy="0" r="2" fill="white"/>
    <circle cx="54" cy="0" r="2" fill="white"/>
    <!-- 鼻子 -->
    <polygon points="40,-5 36,-1 44,-1" fill="#e07090"/>
    <!-- 嘴 -->
    <path d="M36,-1 Q40,4 44,-1" fill="none" stroke="#c8956a" stroke-width="1.2"/>
    <!-- 胡须 -->
    <line x1="10" y1="-2" x2="30" y2="0" stroke="#8a7a6a" stroke-width="0.8"/>
    <line x1="10" y1="4" x2="30" y2="3" stroke="#8a7a6a" stroke-width="0.8"/>
    <line x1="50" y1="0" x2="70" y2="-2" stroke="#8a7a6a" stroke-width="0.8"/>
    <line x1="50" y1="3" x2="70" y2="4" stroke="#8a7a6a" stroke-width="0.8"/>
    <!-- 尾巴 -->
    <path d="M76,40 Q110,20 100,55" fill="none" stroke="#c8956a" stroke-width="5" stroke-linecap="round"/>
    <!-- 前爪 -->
    <ellipse cx="14" cy="68" rx="10" ry="7" fill="#f5c9a0" stroke="#c8956a" stroke-width="1"/>
    <ellipse cx="66" cy="68" rx="10" ry="7" fill="#f5c9a0" stroke="#c8956a" stroke-width="1"/>
  </g>
  <!-- 非数学提示文字 -->
  <text x="200" y="286" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">（这不是数学题）</text>
</svg>
