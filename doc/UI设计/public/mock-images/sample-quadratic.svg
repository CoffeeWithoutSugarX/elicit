<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" style="font-family: serif; background: #faf9f5;">
  <!-- 纸面背景 -->
  <rect width="400" height="300" fill="#faf9f5" rx="2"/>
  <!-- 方格线（淡） -->
  <g stroke="#e8e4d9" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
  </g>
  <!-- 题目文字区 -->
  <text x="20" y="30" font-size="13" fill="#2c2a26" font-weight="600">题目（手写体模拟）</text>
  <text x="20" y="55" font-size="12" fill="#3a3630">已知 f(x) = ax² + bx + c，满足：</text>
  <text x="30" y="75" font-size="12" fill="#3a3630">f(0) = 1，f(1) = 0，f(2) = 3</text>
  <text x="20" y="95" font-size="12" fill="#3a3630">求 a、b、c 的值。</text>
  <!-- 坐标系 -->
  <g transform="translate(60, 240)">
    <!-- x 轴 -->
    <line x1="0" y1="0" x2="280" y2="0" stroke="#2c2a26" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- y 轴 -->
    <line x1="100" y1="20" x2="100" y2="-130" stroke="#2c2a26" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 原点标记 -->
    <text x="104" y="14" font-size="10" fill="#3a3630">O</text>
    <text x="285" y="4" font-size="10" fill="#3a3630">x</text>
    <text x="102" y="-133" font-size="10" fill="#3a3630">y</text>
    <!-- 刻度 -->
    <text x="-5" y="4" font-size="9" fill="#6b6660" text-anchor="middle">0</text>
    <text x="55" y="4" font-size="9" fill="#6b6660" text-anchor="middle">1</text>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#6b6660" stroke-width="1"/>
    <text x="100" y="4" font-size="9" fill="#6b6660" text-anchor="middle">2</text>
    <line x1="160" y1="-3" x2="160" y2="3" stroke="#6b6660" stroke-width="1"/>
    <!-- 三个特殊点 -->
    <circle cx="0" cy="-20" r="3" fill="#c0392b"/>
    <text x="-18" y="-18" font-size="9" fill="#c0392b">(0,1)</text>
    <circle cx="60" cy="0" r="3" fill="#c0392b"/>
    <text x="52" y="-6" font-size="9" fill="#c0392b">(1,0)</text>
    <circle cx="160" cy="-60" r="3" fill="#c0392b"/>
    <text x="164" y="-62" font-size="9" fill="#c0392b">(2,3)</text>
    <!-- 抛物线（手绘风路径） -->
    <path d="M -20 -8 Q 30 -40 80 -10 Q 130 20 200 -80" fill="none" stroke="#1a4a6e" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2c2a26"/>
    </marker>
  </defs>
</svg>
